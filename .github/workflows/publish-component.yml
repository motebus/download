name: Publish reviewed native package candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact reviewed component-releases record (without .json)
        required: true
        type: string
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
  AGPC_SOURCE_COMMIT: 09d20c60f2c84698ad6bb28243f236a6bf02b7ac
concurrency:
  group: native-package-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out exact reviewed GitLab source
        env:
          AGPC_GITLAB_READ_TOKEN: ${{ secrets.AGPC_GITLAB_READ_TOKEN }}
          AGPC_GITLAB_READ_USER: ${{ secrets.AGPC_GITLAB_READ_USER }}
          AGPC_GITLAB_SOURCE_URL: ${{ secrets.AGPC_GITLAB_SOURCE_URL }}
        run: |
          set -euo pipefail
          test -n "$AGPC_GITLAB_READ_TOKEN"
          test -n "$AGPC_GITLAB_READ_USER"
          test -n "$AGPC_GITLAB_SOURCE_URL"
          authorization="$(printf '%s:%s' "$AGPC_GITLAB_READ_USER" "$AGPC_GITLAB_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraHeader=Authorization: Basic $authorization" \
            clone --no-checkout "$AGPC_GITLAB_SOURCE_URL" source
          git -C source checkout --detach "$AGPC_SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$AGPC_SOURCE_COMMIT"
          git -C source remote remove origin
      - name: Publish only source-reviewed immutable asset pins
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/publish_component.py "$RELEASE_TAG"
