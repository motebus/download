name: Publish AGPC v97 Core, Mesh and All

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Producer inputs and native acceptance use the same reviewed activation commit.
  AGPC_SOURCE_COMMIT: ccdbc1fc2b9458856ca7afd2d4df4923213b3470
  AGPC_ACCEPTANCE_SOURCE_COMMIT: ccdbc1fc2b9458856ca7afd2d4df4923213b3470

concurrency:
  group: medge-apt-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - name: Require bound coherent activation commits
        run: |
          python3 - <<'PY_BIND'
          import os, re
          source = os.environ['AGPC_SOURCE_COMMIT']
          acceptance = os.environ['AGPC_ACCEPTANCE_SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Activation source must be an exact commit'
          assert acceptance == source, 'Producer and acceptance must use the same reviewed activation commit'
          PY_BIND
      - name: Check out exact reviewed GitLab source
        env:
          AGPC_GITLAB_READ_TOKEN: ${{ secrets.AGPC_GITLAB_READ_TOKEN }}
          AGPC_GITLAB_READ_USER: ${{ secrets.AGPC_GITLAB_READ_USER }}
          AGPC_GITLAB_SOURCE_URL: ${{ secrets.AGPC_GITLAB_SOURCE_URL }}
        run: |
          set -euo pipefail
          test -n "$AGPC_GITLAB_READ_TOKEN"
          test -n "$AGPC_GITLAB_READ_USER"
          test -n "$AGPC_GITLAB_SOURCE_URL"
          authorization="$(printf '%s:%s' "$AGPC_GITLAB_READ_USER" "$AGPC_GITLAB_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraHeader=Authorization: Basic $authorization" \
            clone --no-checkout "$AGPC_GITLAB_SOURCE_URL" source
          git -C source checkout --detach "$AGPC_SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$AGPC_SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain)"
          git -C source remote remove origin
      - name: Install native repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils gnupg
      - name: Test full private source and export exact public publication inputs
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          test "$(git rev-parse HEAD)" = "$AGPC_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          python3 scripts/export_agpc_public_source.py . "$RUNNER_TEMP/agpc-public-source" \
            --evidence "$RUNNER_TEMP/agpc-public-source.json"
          python3 - <<'PY_PROFILE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'agpc-public-source'
          record = json.loads((root / 'agpc.source.json').read_text())
          cohort = json.loads((root / 'agent-computer-apt-overlay.json').read_text())
          assert record['schema'] == 'agpc-installer-source/v4' and record['tag'] == 'v0.3.0-97'
          assert cohort['schema'] == 'agent-computer-apt-overlay/v13'
          assert cohort['release']['tag'] == 'agent-computer-v0.3.0-87'
          assert (root / 'agpc-mesh.sh').read_bytes() == (root / 'agpc.sh').read_bytes()
          PY_PROFILE
      - name: Import protected archive key
        env:
          MEDGE_APT_SIGNING_KEY: ${{ secrets.MEDGE_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$MEDGE_APT_SIGNING_KEY"
          printf '%s' "$MEDGE_APT_SIGNING_KEY" | gpg --batch --import
      - name: Preserve deployed site and activate signed v13 Core profiles
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          MEDGE_APT_SIGNING_PASSPHRASE: ${{ secrets.MEDGE_APT_SIGNING_PASSPHRASE }}
        run: |
          python3 "$RUNNER_TEMP/agpc-public-source/scripts/publish_agpc_apt.py" \
            "$RUNNER_TEMP/agpc-public-source" "$GITHUB_WORKSPACE/apt-site" \
            --evidence "$RUNNER_TEMP/agpc-promotion.json"
          bash "$GITHUB_WORKSPACE/apt-site/agpc.sh" --help
          bash "$GITHUB_WORKSPACE/apt-site/agpc-mesh.sh" --help
          bash "$GITHUB_WORKSPACE/apt-site/agpc-all.sh" --help
          bash "$GITHUB_WORKSPACE/apt-site/agpc-apps.sh" --help
      - name: Verify signed runtime entrypoints and APT metadata
        working-directory: source
        run: |
          gpgv --keyring ./medge-archive-keyring.gpg "$GITHUB_WORKSPACE/apt-site/dists/stable/InRelease"
          for name in agent-computer-apt-overlay.json agpc.sh agpc.source.json agpc-mesh.sh agpc-mesh.source.json agpc-all.sh agpc-all.source.json agpc-apps.sh agpc-apps.source.json uninstall.sh; do
            gpgv --keyring ./medge-archive-keyring.gpg \
              "$GITHUB_WORKSPACE/apt-site/$name.asc" "$GITHUB_WORKSPACE/apt-site/$name"
          done
          cmp --silent "$RUNNER_TEMP/agpc-public-source/uninstall.sh" "$GITHUB_WORKSPACE/apt-site/uninstall.sh"
          cmp --silent "$GITHUB_WORKSPACE/apt-site/agpc-mesh.sh" "$GITHUB_WORKSPACE/apt-site/agpc.sh"
          for name in agpc-core.sh agpc-core.source.json agpc-core.sh.asc agpc-core.source.json.asc; do
            test ! -e "$GITHUB_WORKSPACE/apt-site/$name"
            test ! -L "$GITHUB_WORKSPACE/apt-site/$name"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agpc-v97-native-staged-site
          path: apt-site/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agpc-v97-promotion-evidence
          path: |
            ${{ runner.temp }}/agpc-promotion*.json
            ${{ runner.temp }}/agpc-public-source.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-site
          retention-days: 30

  native-acceptance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, core, full, apps, upgrade, upgrade-home]
    steps:
      - name: Require bound coherent activation commits
        run: |
          python3 - <<'PY_BIND'
          import os, re
          source = os.environ['AGPC_SOURCE_COMMIT']
          acceptance = os.environ['AGPC_ACCEPTANCE_SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Activation source must be an exact commit'
          assert acceptance == source, 'Producer and acceptance must use the same reviewed activation commit'
          PY_BIND
      - name: Check out exact reviewed GitLab source
        env:
          AGPC_GITLAB_READ_TOKEN: ${{ secrets.AGPC_GITLAB_READ_TOKEN }}
          AGPC_GITLAB_READ_USER: ${{ secrets.AGPC_GITLAB_READ_USER }}
          AGPC_GITLAB_SOURCE_URL: ${{ secrets.AGPC_GITLAB_SOURCE_URL }}
        run: |
          set -euo pipefail
          test -n "$AGPC_GITLAB_READ_TOKEN"
          test -n "$AGPC_GITLAB_READ_USER"
          authorization="$(printf '%s:%s' "$AGPC_GITLAB_READ_USER" "$AGPC_GITLAB_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.extraHeader=Authorization: Basic $authorization" \
            clone --no-checkout "$AGPC_GITLAB_SOURCE_URL" source
          git -C source checkout --detach "$AGPC_ACCEPTANCE_SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$AGPC_ACCEPTANCE_SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain)"
          git -C source remote remove origin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agpc-v97-native-staged-site
          path: apt-site
      - name: Install isolated GTK acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth dbus-daemon
      - name: Install and reinstall native signed profile on disposable VM
        run: >-
          python3 source/scripts/verify_agpc_profiles.py apt-site
          --profile '${{ matrix.profile }}'
          --evidence acceptance/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agpc-v97-native-acceptance-${{ matrix.profile }}
          path: acceptance/
          if-no-files-found: warn

  deploy:
    needs: [build, native-acceptance]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed AGPC v97 Core, Mesh and All
        id: deployment
        uses: actions/deploy-pages@v4
