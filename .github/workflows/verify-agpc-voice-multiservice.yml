name: Verify Voice multiservice native recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  multiservice-native:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate the original reviewed multiservice component inputs
        env:
          AGPC_GITLAB_READ_TOKEN: ${{ secrets.AGPC_GITLAB_READ_TOKEN }}
          AGPC_GITLAB_SOURCE_URL: ${{ secrets.AGPC_GITLAB_SOURCE_URL }}
        run: python3 scripts/stage_agpc_voice_multiservice.py scripts/agpc-voice-multiservice.json voice-multiservice
      - name: Prepare the disposable native fixture and original source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-upgrade python3-yaml python3-websocket adduser
          if [ "$(. /etc/os-release; printf '%s' "$VERSION_ID")" = 26.04 ]; then
            sudo apt-get install -y --no-install-recommends --no-upgrade python3-audioop-lts
          fi
          ! getent passwd agpc-voice
          sudo adduser --system --group --no-create-home --home /nonexistent --shell /usr/sbin/nologin agpc-voice
          test ! -e /var/lib/agpc-voice-multiservice-ci
          sudo install -d -o root -g root -m 0755 /var/lib/agpc-voice-multiservice-ci
          sudo cp -R --no-preserve=ownership voice-multiservice/. /var/lib/agpc-voice-multiservice-ci/
          sudo chmod -R go-w /var/lib/agpc-voice-multiservice-ci
          sudo install -o root -g root -m 0644 scripts/verify_agpc_voice_multiservice_native.py /var/lib/agpc-voice-multiservice-ci/probe.py
          mkdir voice-multiservice-evidence
          cp voice-multiservice/SOURCE.json voice-multiservice-evidence/SOURCE.json
          cp scripts/agpc-voice-multiservice.json voice-multiservice-evidence/producer-inputs.json
      - name: Verify file and Dot recovery against actual systemd and maintenance sockets
        run: |
          set -euo pipefail
          ci_context=("GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" "GITHUB_REF=$GITHUB_REF" "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "GITHUB_SHA=$GITHUB_SHA")
          sudo env "${ci_context[@]}" /usr/bin/python3 -I -B /var/lib/agpc-voice-multiservice-ci/probe.py --disposable | tee voice-multiservice-evidence/RESULT.json
      - name: Retain native observations with explicit fixture boundaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agpc-voice-multiservice-native-${{ matrix.os }}
          path: voice-multiservice-evidence/
          if-no-files-found: error
          retention-days: 30
