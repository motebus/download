name: Validate public Download source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-preflight:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate preview with macOS system Bash (no installation)
        run: |
          /bin/bash --version
          /bin/bash -n agpc-mac.sh
          /bin/bash -n scripts/agpc-host-bridge/mac-codex-session.sh
          /bin/bash agpc-mac.sh --plan
          python3 -m unittest discover -s tests -p 'test_mac_bootstrap.py' -v
          python3 -m unittest discover -s tests -p 'test_host_codex_bridge.py' -v

  macos-native-codex:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned native Mac App-Server without credentials
        run: python3 scripts/agpc-host-bridge/verify-native-mac.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Windows setup and updater without system changes
        shell: powershell
        run: .\scripts\Test-Agpc.ps1 -SkipLinuxChecks
      - name: Verify published native Windows preview command scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $pins = Get-Content scripts/native-pages.json -Raw | ConvertFrom-Json
          $exe = Join-Path $env:RUNNER_TEMP 'agpc-native-preview.exe'
          Invoke-WebRequest https://motebus.github.io/download/agpc.exe -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins.payload_sha256.windows.x86_64) {
            throw 'Published Windows executable does not match the reviewed native payload'
          }
          $infoRaw = & $exe info -Json
          $infoExit = $LASTEXITCODE
          Write-Output "info exit=$infoExit"
          Write-Output $infoRaw
          $info = $infoRaw | ConvertFrom-Json
          if ($infoExit -ne 0 -or $info.platform -ne 'windows' -or $info.architecture -ne 'x86_64' -or $info.ready -ne $false) {
            throw 'Native Windows preview failed its info command'
          }
          $installRaw = & $exe install -Json
          $installExit = $LASTEXITCODE
          Write-Output "install exit=$installExit"
          Write-Output $installRaw
          $install = $installRaw | ConvertFrom-Json
          if ($installExit -ne 2 -or $install.state -ne 'unavailable' -or $install.ready -ne $false) {
            throw 'Unexpected install behavior in this diagnostic-only preview'
          }
          'Verified the hash-pinned published EXE launches natively on Windows x86-64. The install command returns unavailable (exit 2); this preview is not a native installer. ARM64 execution and full runtime acceptance remain unverified.' | Add-Content $env:GITHUB_STEP_SUMMARY
          # The expected nonzero child exit must not become the CI step exit.
          exit 0

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install source-validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg
          mkdir -m 0700 "$RUNNER_TEMP/download-source-public-keyring"
          printf 'TMPDIR=%s\nGNUPGHOME=%s\n' "$RUNNER_TEMP" \
            "$RUNNER_TEMP/download-source-public-keyring" >> "$GITHUB_ENV"

      - name: Run public-source and fixture tests
        # Signature tests use disposable synthetic keys. No archive signing
        # credentials, release environment, artifact promotion or deployment.
        run: python3 -m unittest discover -s tests -v

      - name: Validate the reviewed public tree
        run: python3 scripts/publish_apt.py validate-tree .

  ubuntu-image-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build Ubuntu 26.04 candidate from signed pinned DEBs
        run: docker build --platform linux/amd64 -f scripts/agpc-ubuntu/Dockerfile -t agpc-ubuntu26:candidate .
      - name: Verify image inventory and host adapter configuration
        run: |
          docker run --rm --entrypoint /usr/bin/python3 agpc-ubuntu26:candidate -c '
          import json, pathlib, tomllib
          record = json.loads(pathlib.Path("/usr/share/agpc-build/installed.json").read_text())
          assert record["runtime_ready"] is False
          assert record["version"] == "26.04"
          config = tomllib.loads(pathlib.Path("/etc/cx-mesh/cx-mesh.toml").read_text())
          assert config["codex"]["command"] == "/usr/local/libexec/agpc/codex-stream.py"
          assert config["codex"]["args"] == ["app-server"]
          print(json.dumps(record, indent=2))'
      - name: Verify installed CX-Mesh bridge over Docker exec (simulated host)
        run: python3 scripts/agpc-host-bridge/verify-container-bridge.py
      - name: Diagnose default Docker systemd support (not runtime admission)
        run: python3 scripts/agpc-ubuntu/probe-systemd.py
