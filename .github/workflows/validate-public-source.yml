name: Validate public Download source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-apps-standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install apps without core and reinstall after a failed core receipt
        run: python3 scripts/verify_native_apps_install.py
      - name: Save standalone installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-apps-standalone-acceptance
          path: .cache/native-apps-acceptance/
          if-no-files-found: error

  macos-native-controller:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Execute the pinned controller on native macOS ARM64
        run: python3 scripts/verify_native_mac.py
      - name: Save native controller evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-mac-controller-acceptance
          path: .cache/native-mac-acceptance/
          if-no-files-found: error

  native-linux-install:
    strategy:
      fail-fast: false
      matrix:
        legacy_migration: ["0", "1"]
    env:
      AGPC_TEST_LEGACY_MIGRATION: ${{ matrix.legacy_migration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare a virtual display for headed browser acceptance
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth
      - name: Install and reinstall the pinned native Linux candidate
        run: python3 scripts/verify_native_linux_install.py
      - name: Save native installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-linux-install-acceptance-${{ matrix.legacy_migration }}
          path: .cache/native-linux-acceptance/
          if-no-files-found: error

  macos-preflight:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate preview with macOS system Bash (no installation)
        run: |
          /bin/bash --version
          /bin/bash -n agpc-mac.sh
          /bin/bash -n scripts/agpc-host-bridge/mac-codex-session.sh
          /bin/bash agpc-mac.sh --plan
          python3 -m unittest discover -s tests -p 'test_mac_bootstrap.py' -v
          python3 -m unittest discover -s tests -p 'test_host_codex_bridge.py' -v

  macos-native-codex:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned native Mac App-Server without credentials
        run: python3 scripts/agpc-host-bridge/verify-native-mac.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Windows setup and updater without system changes
        shell: powershell
        run: .\scripts\Test-Agpc.ps1 -SkipLinuxChecks
      - name: Verify published native Windows preview command scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $pins = Get-Content scripts/native-pages.json -Raw | ConvertFrom-Json
          $version = $pins.tag -replace '^agpc-native-v', ''
          $asset = "agpc-win-x86_64-$version.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/motebus/download/releases/download/$($pins.tag)/$asset" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins.assets.$asset.sha256) {
            throw 'Versioned Windows archive does not match the reviewed pin'
          }
          $folder = Join-Path $env:RUNNER_TEMP 'agpc-native-preview'
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $exe = Join-Path $folder 'agpc.exe'
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins.payload_sha256.windows.x86_64) {
            throw 'Published Windows executable does not match the reviewed native payload'
          }
          $infoRaw = & $exe info -Json
          $infoExit = $LASTEXITCODE
          Write-Output "info exit=$infoExit"
          Write-Output $infoRaw
          $info = $infoRaw | ConvertFrom-Json
          if ($infoExit -ne 0 -or $info.platform -ne 'windows' -or $info.architecture -ne 'x86_64' -or $info.ready -ne $false) {
            throw 'Native Windows preview failed its info command'
          }
          $installRaw = & $exe install -Json 2>&1 | Out-String
          $installExit = $LASTEXITCODE
          Write-Output "install exit=$installExit"
          Write-Output $installRaw
          if ($installExit -ne 2 -or $installRaw -notmatch 'native_runtime_manifest_required') {
            throw 'Unexpected fail-closed install behavior without a runtime manifest'
          }
          'Verified the hash-pinned published EXE launches natively on Windows x86-64. The overall installer fails closed without an approved runtime manifest (exit 2); ARM64 execution and full runtime acceptance remain unverified.' | Add-Content $env:GITHUB_STEP_SUMMARY
          # The expected nonzero child exit must not become the CI step exit.
          exit 0

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install source-validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg
          mkdir -m 0700 "$RUNNER_TEMP/download-source-public-keyring"
          printf 'TMPDIR=%s\nGNUPGHOME=%s\n' "$RUNNER_TEMP" \
            "$RUNNER_TEMP/download-source-public-keyring" >> "$GITHUB_ENV"

      - name: Run public-source and fixture tests
        # Signature tests use disposable synthetic keys. No archive signing
        # credentials, release environment, artifact promotion or deployment.
        run: python3 -m unittest discover -s tests -v

      - name: Validate the reviewed public tree
        run: python3 scripts/publish_apt.py validate-tree .

  # AGPC uses native validation. Historical OCI preview checks are retired.
