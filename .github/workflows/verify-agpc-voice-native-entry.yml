name: Verify Voice canonical entry on native Noble

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  entry-native:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Preserve utilities.1 and L1-isolation predecessors; also restore exact K1 office .2 and current L1 service-map packages.
        mode: [fresh, upgrade, upgrade-l1-isolation, upgrade-k1-office, upgrade-servicemap]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact reviewed closed-gate entry CI inputs
        id: source
        env:
          AGPC_GITLAB_READ_TOKEN: ${{ secrets.AGPC_GITLAB_READ_TOKEN }}
          AGPC_GITLAB_SOURCE_URL: ${{ secrets.AGPC_GITLAB_SOURCE_URL }}
        run: python3 scripts/stage_agpc_voice_native_entry_inputs.py scripts/agpc-voice-native-entry-ci.json voice-native-entry-stage
      - name: Prepare disposable Noble prerequisites and root-owned bundle
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-upgrade python3-yaml python3-websocket adduser init-system-helpers libc6 libssl3t64 libuuid1 libsqlite3-0 libcurl4t64 libpcre2-8-0 libspeex1 libspeexdsp1 libtiff6 libjpeg8 zlib1g libstdc++6
          sudo /usr/bin/python3 -I -B - <<'PY'
          import json, stat
          from pathlib import Path
          for name in ('/', '/opt', '/var', '/var/lib'):
              info = Path(name).lstat()
              print(json.dumps({'path': name, 'uid': info.st_uid, 'gid': info.st_gid,
                                'mode': oct(stat.S_IMODE(info.st_mode)),
                                'symlink': stat.S_ISLNK(info.st_mode)}), flush=True)
          for path in (Path('/var/lib'), *Path('/var/lib').parents):
              info = path.lstat()
              if not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o022:
                  raise SystemExit('Untrusted native staging ancestor: ' + str(path))
          for name in ('/var/lib/agpc-voice-native-ci', '/var/lib/agpc-voice-native-host-prep'):
              Path(name).mkdir(mode=0o755, exist_ok=False)
          PY
          sudo cp -R --no-preserve=ownership voice-native-entry-stage/. /var/lib/agpc-voice-native-ci/
          sudo chmod -R go-w /var/lib/agpc-voice-native-ci
          sudo install -o root -g root -m 0644 scripts/prepare_agpc_voice_native_host.py /var/lib/agpc-voice-native-host-prep/prepare.py
          sudo install -o root -g root -m 0644 scripts/prepare_agpc_voice_native_entry_session.py /var/lib/agpc-voice-native-host-prep/session.py
          sudo install -o root -g root -m 0644 scripts/collect_agpc_voice_native_process_evidence.py /var/lib/agpc-voice-native-host-prep/collect.py
          sudo /usr/bin/python3 -I -B /var/lib/agpc-voice-native-host-prep/prepare.py | tee "$RUNNER_TEMP/voice-native-entry-host-preparation.jsonl"
      - name: Validate the canonical entry lifecycle in its finite CI session
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_MANIFEST_SHA256: ${{ steps.source.outputs.source_manifest_sha256 }}
          TEST_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ci_context=("GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" "GITHUB_REF=$GITHUB_REF" "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "GITHUB_SHA=$GITHUB_SHA")
          sudo env "${ci_context[@]}" /usr/bin/python3 -I -B /var/lib/agpc-voice-native-host-prep/session.py --mode "$TEST_MODE" --source-commit "$SOURCE_COMMIT" --source-manifest-sha256 "$SOURCE_MANIFEST_SHA256"
          sudo env "${ci_context[@]}" /usr/bin/python3 -I -B /var/lib/agpc-voice-native-ci/scripts/verify_agpc_voice_native_entry_ci.py --mode "$TEST_MODE" --source-commit "$SOURCE_COMMIT" --execute
      - name: Export only this run's generated evidence
        if: always()
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          case "$TEST_MODE" in fresh|upgrade|upgrade-l1-isolation|upgrade-k1-office|upgrade-servicemap) ;; *) exit 2 ;; esac
          mkdir -m 0700 "$RUNNER_TEMP/voice-native-entry-evidence"
          run_directory="/var/lib/agpc-voice-native-entry-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TEST_MODE"
          if sudo test -d "$run_directory"; then
            ci_context=("GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" "GITHUB_REF=$GITHUB_REF" "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "GITHUB_SHA=$GITHUB_SHA")
            # A diagnostic refusal remains visible while original evidence is
            # still retained. No failed lifecycle is converted into success.
            diagnostic_exit=0
            sudo env "${ci_context[@]}" /usr/bin/python3 -I -B /var/lib/agpc-voice-native-host-prep/collect.py --mode "$TEST_MODE" || diagnostic_exit=$?
            sudo tar -C "$run_directory" -cf - . > "$RUNNER_TEMP/voice-native-entry-evidence/$TEST_MODE.tar"
            exit "$diagnostic_exit"
          fi
      - name: Retain CI evidence without production, historical L1 or phone acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agpc-voice-canonical-entry-native-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/voice-native-entry-evidence/${{ matrix.mode }}.tar
            ${{ runner.temp }}/voice-native-entry-host-preparation.jsonl
          if-no-files-found: error
          retention-days: 30
