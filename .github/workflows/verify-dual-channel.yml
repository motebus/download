name: Verify Mote Transport Dual Channel bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Mote Transport release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mote-transport-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          [[ "$TAG" =~ ^mote-transport-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]] \
            || { echo "invalid release tag: $TAG" >&2; exit 1; }
          mkdir -p release-input/current
          gh release download "$TAG" --dir release-input/current
          jq -e --arg tag "$TAG" \
            '.schema == "mote-transport-dual-channel-public-release/v2" and .tag == $tag' \
            release-input/current/release-manifest.json >/dev/null
          printf 'CURRENT_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

      - name: Verify hashes and the exact Debian package chain
        run: |
          set -euo pipefail
          (cd release-input/current && sha256sum -c SHA256SUMS)
          node scripts/verify-dual-channel-bundle.js \
            --assets-dir release-input/current \
            --output dual-channel-e2e.json

      - uses: actions/upload-artifact@v4
        with:
          name: dual-channel-e2e-${{ env.CURRENT_TAG }}
          path: dual-channel-e2e.json
          retention-days: 90
