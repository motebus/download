name: Publish native AGPC standard and full installers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
env:
  PYTHONDONTWRITEBYTECODE: "1"
concurrency:
  group: medge-apt-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils gnupg
      - name: Verify public source and profile publication boundaries
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/publish_apt.py validate-tree .
      - name: Import protected archive key
        env:
          MEDGE_APT_SIGNING_KEY: ${{ secrets.MEDGE_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$MEDGE_APT_SIGNING_KEY"
          printf '%s' "$MEDGE_APT_SIGNING_KEY" | gpg --batch --import
      - name: Preserve deployed site and activate signed native profiles
        env:
          GH_TOKEN: ${{ github.token }}
          MEDGE_APT_SIGNING_PASSPHRASE: ${{ secrets.MEDGE_APT_SIGNING_PASSPHRASE }}
        run: |
          python3 scripts/publish_agpc_apt.py . apt-site --evidence "$RUNNER_TEMP/agpc-promotion.json"
          bash apt-site/agpc.sh --help
          bash apt-site/agpc-all.sh --help
      - name: Verify signed standard and full profiles
        run: |
          gpgv --keyring ./medge-archive-keyring.gpg apt-site/agpc.sh.asc apt-site/agpc.sh
          gpgv --keyring ./medge-archive-keyring.gpg apt-site/agpc.source.json.asc apt-site/agpc.source.json
          gpgv --keyring ./medge-archive-keyring.gpg apt-site/agpc-all.sh.asc apt-site/agpc-all.sh
          gpgv --keyring ./medge-archive-keyring.gpg apt-site/agpc-all.source.json.asc apt-site/agpc-all.source.json
          gpgv --keyring ./medge-archive-keyring.gpg apt-site/uninstall.sh.asc apt-site/uninstall.sh
          cmp --silent uninstall.sh apt-site/uninstall.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agpc-native-staged-site
          path: apt-site/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agpc-native-promotion-evidence
          path: ${{ runner.temp }}/agpc-promotion*.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-site
          retention-days: 30
  native-acceptance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, full, upgrade]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agpc-native-staged-site
          path: apt-site
      - name: Install and reinstall native signed profile on disposable VM
        run: python3 scripts/verify_agpc_profiles.py apt-site --profile '${{ matrix.profile }}' --evidence acceptance/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agpc-native-acceptance-${{ matrix.profile }}
          path: acceptance/
          if-no-files-found: warn
  deploy:
    needs: [build, native-acceptance]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish both signed AGPC entrypoints and APT metadata
        id: deployment
        uses: actions/deploy-pages@v4
