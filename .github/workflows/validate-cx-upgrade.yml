name: Validate native CX upgrade fixture
on:
  pull_request:
    paths:
      - '.github/workflows/validate-cx-upgrade.yml'
      - 'scripts/check_cx_mesh_upgrade.py'
      - 'tests/cx-mesh-upgrade/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned public historical package state
        run: python3 scripts/check_cx_mesh_upgrade.py --historical-only
