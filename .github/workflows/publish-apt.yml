name: Publish approved Install Sphere APT repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Approved published Install Sphere medge-v<version> release tag
        required: true
        type: string
      agent_computer_tag:
        description: Optional exact agent-computer-v<version> aggregate tag; must match reviewed active v3 pins
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: medge-apt-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'medge-v')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate binary-only public tree
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests
          python3 scripts/publish_apt.py validate-tree .

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Download approved Install Sphere release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          [[ "$TAG" =~ ^medge-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] \
            || { echo "invalid release tag: $TAG" >&2; exit 1; }
          mkdir -p release-input/current
          gh release download "$TAG" --dir release-input/current
          chmod 0755 release-input/current/sphere.sh \
            release-input/current/webdesk.sh \
            release-input/current/sshkit.sh \
            release-input/current/uninstall.sh
          python3 scripts/publish_apt.py validate-bundle release-input/current
          BUNDLE_TAG="$(python3 -c 'import json; print("medge-v" + json.load(open("release-input/current/release-manifest.json"))["medge_version"])')"
          [[ "$BUNDLE_TAG" == "$TAG" ]] \
            || { echo "release tag does not match bundle version" >&2; exit 1; }
          printf 'CURRENT_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

      - name: Validate Ubuntu 24.04 and 26.04 package compatibility
        run: scripts/validate-ubuntu-compatibility.sh release-input/current

      - name: Download pinned Agent Computer APT additions
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_COMPUTER_TAG: ${{ inputs.agent_computer_tag }}
        run: |
          set -euo pipefail
          if test -n "$AGENT_COMPUTER_TAG"; then
            python3 scripts/publish_apt.py validate-agent-computer-release-tag . "$AGENT_COMPUTER_TAG"
          fi
          python3 scripts/publish_apt.py download-agent-computer-overlay . release-input/agent-computer

      - name: Verify official upstream prerequisites outside the published site
        run: python3 scripts/publish_apt.py download-agent-computer-prerequisites . release-input/agent-computer-prerequisites

      - name: Import protected archive key
        env:
          MEDGE_APT_SIGNING_KEY: ${{ secrets.MEDGE_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$MEDGE_APT_SIGNING_KEY"
          printf '%s' "$MEDGE_APT_SIGNING_KEY" | gpg --batch --import

      - name: Build and sign APT repository
        env:
          MEDGE_APT_SIGNING_PASSPHRASE: ${{ secrets.MEDGE_APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 scripts/publish_apt.py build . apt-site release-input/current --agent-computer-overlay release-input/agent-computer
          test -s apt-site/release-manifest.json.asc
          gpgv --keyring ./medge-archive-keyring.gpg \
            apt-site/release-manifest.json.asc apt-site/release-manifest.json
          if test -f apt-site/agent-computer-apt-overlay.json; then
            gpgv --keyring ./medge-archive-keyring.gpg \
              apt-site/agent-computer-apt-overlay.json.asc apt-site/agent-computer-apt-overlay.json
          fi
          gpgv --keyring ./medge-archive-keyring.gpg \
            apt-site/agent-sphere-apps.sh.asc apt-site/agent-sphere-apps.sh
          gpgv --keyring ./medge-archive-keyring.gpg \
            apt-site/agent-sphere-apps.source.json.asc apt-site/agent-sphere-apps.source.json
          test "$(du -sb apt-site | cut -f1)" -lt 1000000000

      - name: Verify Agent Sphere automatic resolution from the signed APT index
        run: python3 scripts/validate_agent_sphere_apt.py . apt-site --external-prerequisites release-input/agent-computer-prerequisites

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved APT repository
        id: deployment
        uses: actions/deploy-pages@v4
